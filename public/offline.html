<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TaskPilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 24px; line-height: 1.5; }
    .features {
      text-align: left;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .features h3 { font-size: 14px; margin-bottom: 12px; color: rgba(255,255,255,0.8); }
    .features li {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-bottom: 8px;
      list-style: none;
    }
    .features li::before { content: "✓ "; color: #22c55e; }
    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You&apos;re Offline</h1>
    <p>TaskPilot works offline for basic tasks. Your changes will sync when you&apos;re back online.</p>
    <div class="features">
      <h3>Available Offline:</h3>
      <ul>
        <li>View recent tasks</li>
        <li>Create and edit tasks</li>
        <li>Change task status</li>
        <li>View today&apos;s schedule</li>
      </ul>
    </div>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
